[package]
name = "keep"
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
authors = ["James Ross <james@flyingrobots.dev>"]
description = "Correctness-first content-addressed storage"
repository = "https://github.com/flyingrobots/keep"
license = "Apache-2.0"
readme = "README.md"
keywords = ["cas", "storage", "content-addressed", "deduplication"]
categories = ["data-structures", "filesystem"]
publish = false

[dependencies]
blake3 = { version = "=1.8.5", default-features = false, features = ["pure", "std"] }

[dev-dependencies]
allocation-counter = { version = "=0.8.1", default-features = false }
divan = { version = "=0.1.21", default-features = false }

[[bench]]
name = "streaming_cdc"
harness = false

[workspace]
members = [".", "xtask"]
resolver = "3"

[lints]
workspace = true

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unused_must_use = "deny"
unreachable_pub = "deny"
unexpected_cfgs = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
exit = "deny"

indexing_slicing = "deny"
integer_division = "deny"
arithmetic_side_effects = "deny"
float_arithmetic = "deny"

cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
cast_precision_loss = "deny"
as_conversions = "deny"

mem_forget = "deny"
large_stack_arrays = "deny"
large_types_passed_by_value = "deny"
needless_pass_by_value = "deny"
needless_collect = "deny"
implicit_clone = "deny"
clone_on_ref_ptr = "deny"

string_slice = "deny"
str_to_string = "deny"
inefficient_to_string = "deny"

wildcard_imports = "deny"
enum_glob_use = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
