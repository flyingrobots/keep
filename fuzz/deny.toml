[advisories]
version = 2
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
]
exceptions = [
  # `arrayref` is a required transitive dependency of locked BLAKE3 1.8.5.
  { allow = ["BSD-2-Clause"], crate = "arrayref@0.3.9" },
  # `libfuzzer-sys` is confined to this non-published fuzz workspace.
  { allow = ["MIT", "NCSA"], crate = "libfuzzer-sys@0.4.13" },
]

[sources]
unknown-git = "deny"
unknown-registry = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
