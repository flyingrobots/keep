[package]
name = "keep-fuzz"
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
keep = { path = "..", version = "=0.0.0" }
libfuzzer-sys = { version = "=0.4.13", default-features = false, features = ["link_libfuzzer"] }
xtask = { path = "../xtask", version = "=0.0.0", default-features = false, features = ["golden-protocol-fuzz", "repository-json-fuzz"] }

[lints.rust]
warnings = "deny"
unsafe_code = "forbid"
unused_must_use = "deny"
unreachable_pub = "deny"
unexpected_cfgs = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
exit = "deny"

indexing_slicing = "deny"
integer_division = "deny"
arithmetic_side_effects = "deny"
float_arithmetic = "deny"

cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
cast_precision_loss = "deny"
as_conversions = "deny"

mem_forget = "deny"
large_stack_arrays = "deny"
large_types_passed_by_value = "deny"
needless_pass_by_value = "deny"
needless_collect = "deny"
implicit_clone = "deny"
clone_on_ref_ptr = "deny"

string_slice = "deny"
str_to_string = "deny"
inefficient_to_string = "deny"

wildcard_imports = "deny"
enum_glob_use = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "deny"
missing_panics_doc = "deny"

[[bin]]
name = "blob_id_binary"
path = "fuzz_targets/blob_id_binary.rs"
test = false
doc = false
bench = false

[[bin]]
name = "blob_id_text"
path = "fuzz_targets/blob_id_text.rs"
test = false
doc = false
bench = false

[[bin]]
name = "blob_hasher"
path = "fuzz_targets/blob_hasher.rs"
test = false
doc = false
bench = false

[[bin]]
name = "catalog_format"
path = "fuzz_targets/catalog_format.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fast_cdc"
path = "fuzz_targets/fast_cdc.rs"
test = false
doc = false
bench = false

[[bin]]
name = "golden_protocol"
path = "fuzz_targets/golden_protocol.rs"
test = false
doc = false
bench = false

[[bin]]
name = "layout_record"
path = "fuzz_targets/layout_record.rs"
test = false
doc = false
bench = false

[[bin]]
name = "migration_format"
path = "fuzz_targets/migration_format.rs"
test = false
doc = false
bench = false

[[bin]]
name = "repository_json"
path = "fuzz_targets/repository_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "retention_format"
path = "fuzz_targets/retention_format.rs"
test = false
doc = false
bench = false

[[bin]]
name = "segment_format"
path = "fuzz_targets/segment_format.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
resolver = "3"
