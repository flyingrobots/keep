[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
publish = false

[features]
default = ["repository-tasks"]
golden-protocol-fuzz = []
repository-tasks = [
    "dep:blake3",
    "dep:cap-fs-ext",
    "dep:cap-std",
    "dep:md-5",
    "dep:rustix",
    "dep:serde",
    "dep:serde_json",
]

[dependencies]
# Independent Golden File Worldline oracle recomputes BLAKE3 corpus witnesses.
blake3 = { version = "=1.8.5", default-features = false, features = ["pure", "std"], optional = true }
# Capability-relative, no-follow opens close source-scan replacement races.
cap-fs-ext = { version = "=4.0.2", default-features = false, features = ["std"], optional = true }
cap-std = { version = "=4.0.2", default-features = false, optional = true }
# Pure Rust MD5 regenerates the public Gear-table recipe; it is not an identity primitive.
md-5 = { version = "=0.11.0", default-features = false, optional = true }
# Safe POSIX process-group signaling bounds failed repository-tool subprocesses.
rustix = { version = "=1.1.4", default-features = false, features = ["process", "std"], optional = true }
# Serde drives duplicate-refusing repository JSON admission; no types escape xtask.
serde = { version = "=1.0.229", default-features = false, features = ["std"], optional = true }
# Typed JSON admission checks the committed documentation-tool lock graph.
serde_json = { version = "=1.0.151", default-features = false, features = ["std"], optional = true }

[[bin]]
name = "xtask"
path = "src/main.rs"
required-features = ["repository-tasks"]

[lints]
workspace = true
